--text:#ededed; --text-2:#b8b8bd; --dim:#6b6b70; --line:#2a2a2e; --ink:#0d0d0f;
--rec:#ff3a2f;
--sans:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif;
--mono:'Geist Mono',ui-monospace,Menlo,monospace;
/* the scale · 1.5, display-led: 11 / 16 / 24 / 36 / 54 / 81 / 122 / 168 */
--s0:11px; --s1:clamp(15px,.5vw + 13px,17px); --s2:clamp(19px,1.2vw + 14px,24px); --s3:clamp(24px,2vw + 16px,36px);
--s4:clamp(30px,3.2vw + 14px,54px); --s5:clamp(40px,5vw + 16px,81px); --s6:clamp(52px,8vw + 14px,122px); --s7:clamp(64px,11vw + 12px,168px);
--gutter:clamp(20px,4.2vw,64px); --nav:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;background:var(--ground);color:var(--text);font:400 var(--s1)/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
::selection{background:var(--rec);color:#000}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* ── the stage · fixed full-bleed canvas, the page scrolls over it ── */
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;touch-action:pan-y}
html.nogpu #cv{display:none}
/* poster mode (software GL): the one rendered hero frame stays for the hero and leaves with it */
/* no fade here: every frame of a canvas opacity transition is a full software recomposite (measured: a 570 ms stall) */
html.poster.away #cv{visibility:hidden}
html.poster .rev,html.poster #strip .stack b,html.poster #engines .strip b,html.poster #connect .port,html.poster #strip .idx i,html.poster #seq .cell,html.poster #seq .cell::before,html.poster #seq .vu i,html.poster #seq .steps i,html.poster #flip .plate,html.poster #seq .recdot,html.poster #seq .phbar{transition:none}
/* and nothing that costs a software painter: no vignette, no shadows, no grain, no masks */
html.poster #vig,html.poster .deck::after,html.poster .deck .sweep{display:none}
html.poster .cell,html.poster .deck{box-shadow:none}
html.poster .btn::before,html.poster .deck::before{display:none}
html.poster .btn{border:1px solid rgba(255,255,255,.25)}
html.poster #grain{display:none}
html.nogpu body{background:#0a0a0b radial-gradient(70% 45% at 50% 62%,#2a2a2e 0%,#0a0a0b 70%) no-repeat fixed}
#page{position:relative;z-index:2}
/* film grain + vignette · a real texture, drawn once on a canvas at boot (see _site.js), never a live filter */
#grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.055;background-repeat:repeat;background-size:220px 220px;mix-blend-mode:screen}
#vig{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
/* ── loading · it must clear; ship-check asserts it from a file:// URL ── */
#loading{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center;transition:opacity .7s ease .1s;pointer-events:none}
#loading.off{opacity:0}
#loading b{font:400 var(--s0)/1 var(--mono);letter-spacing:.14em;color:var(--dim)}
#loading b::after{content:'';display:block;width:64px;height:1px;background:var(--line);margin:14px auto 0;position:relative;overflow:hidden}
#loading b i{position:absolute;left:0;top:0;height:1px;width:0;background:var(--text);transition:width .4s ease}
/* ── nav · a fixed bar that stays fixed. small wordmark, three quiet links, one worked button ── */
#nav{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 var(--gutter);
font:400 var(--s0)/1 var(--mono);letter-spacing:.06em;color:var(--text-2);mix-blend-mode:difference}
#nav .wm{text-decoration:none;color:#fff;letter-spacing:.1em}
#nav .links{display:flex;gap:clamp(18px,2.4vw,36px);align-items:center}
#nav .links a{text-decoration:none;color:#fff;opacity:.72;transition:opacity .25s ease}
#nav .links a:hover{opacity:1}
#nav .snd{display:inline-flex;align-items:center;gap:8px;color:#fff;opacity:.72;transition:opacity .25s ease;letter-spacing:.06em}
#nav .snd:hover{opacity:1}
#nav .snd i{display:inline-block;width:14px;height:8px;position:relative}
#nav .snd i::before,#nav .snd i::after,#nav .snd i b{content:'';position:absolute;bottom:0;width:2px;background:#fff;left:0;height:3px;transform-origin:bottom}
#nav .snd i::after{left:6px;height:8px}
#nav .snd i b{left:12px;height:5px}
#nav .snd.on i::before{animation:eq .9s ease-in-out infinite alternate}
#nav .snd.on i::after{animation:eq .7s ease-in-out infinite alternate-reverse}
#nav .snd.on i b{animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;font:400 var(--s0)/1 var(--mono);letter-spacing:.08em;color:#fff;text-decoration:none;
background:rgba(255,255,255,.04);isolation:isolate;overflow:hidden;transition:background .3s ease}
.btn::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 45%,rgba(255,255,255,.28));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.btn::after{content:'';position:absolute;top:-60%;bottom:-60%;left:-40%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg) translateX(-120%);transition:transform .8s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.btn:hover{background:rgba(255,255,255,.08)}
.btn:hover::after{transform:skewX(-18deg) translateX(520%)}
.btn .price{color:var(--text-2)}
#nav .btn{mix-blend-mode:normal}
/* ── type ── */
.k{font:400 var(--s0)/1.4 var(--mono);letter-spacing:.08em;color:var(--dim)}
.k b{font-weight:400;color:var(--text-2)}
h1,h2,h3{font-weight:200;margin:0;letter-spacing:-.03em;line-height:.92;text-wrap:balance}
p{margin:0;color:var(--text-2)}
.lines .l{display:block;overflow:hidden}
.lines .l span{display:block;transform:translateY(110%);will-change:transform}
.rev{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rev.in{opacity:1;transform:none}
/* every beat is a tall section with a sticky 100vh stage; the camera travels over its first third.
The stages let the pointer THROUGH to the canvas (the keys are hoverable); only their children catch it. */
.beat{position:relative;pointer-events:none}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;pointer-events:none}
.stage &gt; *{pointer-events:auto}
#page{pointer-events:none}
/* ── 1 · hero · the wordmark bottom-left, the claim top-right, the product between them ── */
#hero{height:200vh}
#hero .stage{display:block}
#hero .claim,#hero .wm{transition:opacity .2s linear}
#hero .claim{position:absolute;top:calc(var(--nav) + 4vh);right:var(--gutter);width:min(38vw,22ch);text-align:right;font-size:var(--s3);font-weight:300;line-height:1.14;letter-spacing:-.02em;color:var(--text)}
#hero .wm{position:absolute;left:calc(var(--gutter) - .06em);bottom:clamp(20px,5vh,56px)}
#hero .wm h1{font-size:var(--s7);letter-spacing:-.04em;line-height:.86;white-space:nowrap;display:flex}
#hero .wm h1 span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(.08em)}
#hero .wm .k{margin-top:14px;display:flex;gap:1.2em}
#hero .wm .k span{opacity:0}
/* ── 2 · strip · one word at a time, huge, in the band above the instrument seen from the top ── */
#strip{height:260vh}
#strip .stack{position:absolute;left:calc(var(--gutter) - .04em);right:36vw;top:calc(var(--nav) + 2vh);height:1.1em;font-size:var(--s7);line-height:1;overflow:hidden}
#strip .stack b{position:absolute;left:0;top:0;font-weight:200;letter-spacing:-.04em;line-height:1;color:var(--text);white-space:nowrap;
transform:translateY(105%);opacity:0;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .5s ease}
#strip .stack b.on{transform:translateY(0);opacity:1}
#strip .stack b.was{transform:translateY(-105%);opacity:0}
#strip .cap{position:absolute;right:var(--gutter);top:calc(var(--nav) + 3vh);width:min(34vw,32ch);text-align:right}
#strip .cap p{margin-top:8px;color:var(--text-2);font-size:var(--s1)}
#strip .idx{position:absolute;left:var(--gutter);top:calc(var(--nav) + 2vh + var(--s7) * 1.1 + 10px);display:flex;gap:10px;align-items:center}
#strip .idx i{display:block;width:34px;height:2px;background:#2a2a2e;border-radius:1px;transition:background .3s}
#strip .idx i.on{background:var(--text)}
/* ── 2b · macro · the scroll dollies along a rail of close-ups; one small slate names what is in focus ── */
#macro{height:340vh}
#macro .slate{position:absolute;left:var(--gutter);bottom:clamp(20px,5vh,56px);display:flex;flex-direction:column;gap:6px;padding:14px 18px;border-radius:12px;
background:rgba(10,10,11,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#macro .slate .k{color:var(--text-2)}
#macro .slate b{display:block;font:300 var(--s3)/1.05 var(--sans);letter-spacing:-.02em;color:var(--text)}
#macro .slate .row{display:none}
#macro .slate .row.on{display:block}
#macro .slate .row b,#macro .slate .row .k{transition:opacity .3s ease}
/* ── 3 · engines · a filmstrip of engine names across the top band, the key field below ── */
#engines{height:300vh}
#engines .band{position:absolute;left:0;right:0;top:calc(var(--nav) + 3vh);overflow:hidden}
#engines .strip{display:flex;gap:.6em;white-space:nowrap;padding-left:var(--gutter);will-change:transform}
#engines .strip b{font-weight:300;font-size:var(--s5);letter-spacing:-.03em;line-height:1;color:rgba(237,237,237,.42);transition:color .35s ease;display:inline-flex;align-items:baseline;gap:.6em}
#engines .strip b::after{content:'·';color:rgba(237,237,237,.22);font-weight:200}
#engines .strip b:last-child::after{content:''}
#engines .strip b.on{color:var(--text)}
#engines .strip b.on::after{color:#2a2a2e}
#engines .idx{position:absolute;left:var(--gutter);top:calc(var(--nav) + 3vh + var(--s5) + 26px);display:flex;align-items:center;gap:14px}
#engines .idx .n{font:200 var(--s3)/1 var(--sans);letter-spacing:-.02em;min-width:2ch}
#engines .idx .bar{width:120px;height:1px;background:var(--line);position:relative}
#engines .idx .bar i{position:absolute;left:0;top:0;height:1px;background:var(--text);width:0}
#engines .copy{position:absolute;right:var(--gutter);top:calc(var(--nav) + 3vh + var(--s5) + 22px);width:min(44vw,40ch);text-align:right}
#engines .copy p{font-size:var(--s1)}
/* ── 4 · sequencer · the instrument high in frame; beneath it, its own display blown up: a black
plate with sixteen columns of KEYS, a live scope, a grayscale meter, a sweeping playhead ── */
#seq{height:260vh}
.deck{position:relative;border-radius:16px;background:linear-gradient(180deg,#141416 0%,#0c0c0e 60%,#0a0a0b 100%);
box-shadow:0 40px 90px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.04) inset,0 -1px 0 rgba(0,0,0,.8) inset}
.deck::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.05) 30%,rgba(255,255,255,.02) 65%,rgba(255,255,255,.18));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.deck::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.05;background:var(--grain-url) repeat;background-size:220px 220px;mix-blend-mode:screen}
.deck .sweep{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.deck .sweep::before{content:'';position:absolute;top:-40%;bottom:-40%;left:-30%;width:26%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.05),transparent);transform:skewX(-16deg) translateX(-140%)}
.deck.run .sweep::before{animation:deck-sweep 4.8s cubic-bezier(.3,.6,.2,1) infinite}
@keyframes deck-sweep{0%{transform:skewX(-16deg) translateX(-140%)}55%,100%{transform:skewX(-16deg) translateX(620%)}}
#seq .panel{position:absolute;left:50%;bottom:clamp(16px,3vh,40px);transform:translateX(-50%);width:min(1160px,calc(100vw - 2*var(--gutter)));padding:16px 22px 16px}
#seq .top{display:grid;grid-template-columns:auto 1fr auto auto;gap:24px;align-items:center;margin-bottom:12px}
#seq .top h2{font-size:var(--s2);font-weight:300;letter-spacing:-.02em;line-height:1;margin-bottom:6px}
#seq .top .k{display:flex;gap:1.2em;white-space:nowrap}
#seq .scope{width:100%;max-width:420px;height:40px;display:block;justify-self:center;opacity:.95}
#seq .vu{display:grid;grid-template-columns:repeat(16,6px);gap:3px;align-items:end;height:30px}
#seq .vu i{display:block;height:100%;border-radius:1px;background:var(--seg,#2a2a2e);opacity:.28;transition:opacity .06s linear}
#seq .vu i.on{opacity:1}
#seq .tr{display:flex;align-items:center;gap:16px}
#seq .recdot{width:10px;height:10px;border-radius:50%;background:#3a1a18;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset;transition:background .1s,box-shadow .1s}
#seq .recdot.on{background:var(--rec);box-shadow:0 0 12px rgba(255,58,47,.8)}
#seq .bpm{display:inline-flex;align-items:baseline;gap:6px;font:400 var(--s0)/1 var(--mono);letter-spacing:.08em;color:var(--text-2);cursor:ns-resize;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);user-select:none}
#seq .bpm b{font:300 22px/1 var(--sans);letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:right}
#seq .bpm:hover{background:rgba(255,255,255,.08)}
#seq #seqPlay{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#ededed;color:#000;transition:transform .15s ease,background .2s}
#seq #seqPlay:hover{transform:scale(1.06)}
#seq #seqPlay svg{width:13px;height:13px;fill:#000}
#seq .grid{display:grid;grid-template-columns:64px repeat(16,1fr);gap:5px 5px;align-items:stretch;touch-action:none;user-select:none}
#seq .grid .lab{font:400 var(--s0)/1 var(--mono);letter-spacing:.08em;color:var(--dim);align-self:center;padding-right:8px}
#seq .cell{position:relative;height:clamp(22px,2.6vh + 8px,34px);border-radius:6px;cursor:pointer;
background:linear-gradient(180deg,#26262a,#161618 70%,#121214);
box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 -1px 0 rgba(0,0,0,.7) inset,0 2px 5px rgba(0,0,0,.55);
transition:transform .08s ease,filter .12s ease,box-shadow .12s ease}
#seq .cell::before{content:'';position:absolute;top:6px;right:7px;width:4px;height:4px;border-radius:50%;background:#3a3a40;box-shadow:0 0 0 1px rgba(0,0,0,.5);transition:background .1s,box-shadow .1s}
#seq .cell:hover{filter:brightness(1.25)}
#seq .cell.on::before{background:#fff;box-shadow:0 0 7px rgba(255,255,255,.9)}
#seq .cell.rec.on::before{background:var(--rec);box-shadow:0 0 7px rgba(255,58,47,.9)}
#seq .cell.on{background:linear-gradient(180deg,#34343a,#202024 70%,#1a1a1e)}
#seq .cell.ph{filter:brightness(1.45)}
#seq .cell.hit{transform:translateY(1px) scale(.95);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 -1px 0 rgba(0,0,0,.7) inset,0 0 0 rgba(0,0,0,0)}
#seq .cell:nth-child(4n+2){margin-left:4px}
#seq .steps{position:relative;display:grid;grid-template-columns:64px repeat(16,1fr);gap:0 5px;margin-top:6px;height:14px}
#seq .steps i{font:400 10px/16px var(--mono);color:var(--dim);text-align:center;font-style:normal;letter-spacing:.04em;transition:color .1s}
#seq .steps i:nth-child(4n+2){margin-left:4px}
#seq .steps i.ph{color:var(--text)}
#seq .phbar{position:absolute;left:0;bottom:-6px;height:2px;width:40px;background:#fff;border-radius:1px;box-shadow:0 0 8px rgba(255,255,255,.7);opacity:0;transition:opacity .2s}
.deck.run .phbar{opacity:1}
#seq .note{position:absolute;left:var(--gutter);top:calc(var(--nav) + 2vh);max-width:30ch}
#seq .note p{font-size:var(--s1)}
#seq .note p{margin-top:10px}
/* ── 5 · connect · the light act. a caption band along the bottom ticks port by port ── */
#connect{height:300vh}
#connect .stage{color:var(--ink)}
#connect .band{position:absolute;left:var(--gutter);right:var(--gutter);bottom:clamp(20px,5vh,56px);display:grid;grid-template-columns:repeat(6,1fr);gap:18px;border-top:1px solid rgba(0,0,0,.18);padding-top:16px}
#connect .band .port{color:rgba(0,0,0,.34);transition:color .35s ease}
#connect .band .port b{display:block;font:200 var(--s3)/1 var(--sans);letter-spacing:-.02em;margin-bottom:8px}
#connect .band .port span{display:block;font:400 var(--s0)/1.45 var(--mono);letter-spacing:.06em;max-width:22ch}
#connect .band .port.on{color:var(--ink)}
#connect .head{position:absolute;left:var(--gutter);top:calc(var(--nav) + 4vh);max-width:22ch}
#connect .head h2{font-size:var(--s4);font-weight:200;letter-spacing:-.03em;line-height:.98;color:var(--ink)}
#connect .head p{color:rgba(0,0,0,.6);margin-top:14px;max-width:34ch}
/* ── 6 · flip · the underside; the spec set as the plate printed there ── */
#flip{height:240vh}
#flip .stage{color:var(--ink)}
#flip .plate{position:absolute;right:var(--gutter);bottom:clamp(20px,5vh,56px);width:min(46vw,440px);font:400 var(--s0)/1.7 var(--mono);letter-spacing:.06em;color:var(--ink);transition:color .5s ease}
#flip .plate .row{display:grid;grid-template-columns:9ch 1fr;gap:10px;padding:7px 0;border-top:1px solid currentColor;border-color:rgba(128,128,128,.28)}
#flip .plate .row span:first-child{color:rgba(128,128,128,.9)}
#flip .plate .langs{margin-top:18px;color:rgba(128,128,128,.9);font-size:10px;letter-spacing:.1em;line-height:1.8}
#flip .plate .langs b{font-weight:400;color:currentColor}
#flip .head{position:absolute;left:var(--gutter);top:calc(var(--nav) + 4vh);max-width:20ch}
#flip .head h2{font-size:var(--s4);font-weight:200;letter-spacing:-.03em;line-height:.98}
#flip .head p{margin-top:14px;max-width:32ch;color:rgba(0,0,0,.62)}
#flip.dark .head p{color:var(--text-2)}
#flip.dark .stage{color:var(--text)}
#flip.dark .plate{color:var(--text)}
#flip.dark .plate .row span:first-child,#flip.dark .plate .langs{color:var(--dim)}
/* ── 7 · close · centred stage, type centred beneath ── */
#close{height:170vh}
#close .stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:clamp(20px,5vh,56px)}
#close .cta{text-align:center;margin-bottom:6vh}
#close .cta h2{font-size:var(--s6);font-weight:200;letter-spacing:-.04em;line-height:.9}
#close .cta .k{margin:14px 0 26px;font-size:var(--s0)}
#close .cta .k b{color:var(--text)}
#close .cta .acts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#close .cta .acts .btn{padding:14px 22px;font-size:var(--s0)}
#close .cta .acts .ghost{background:transparent}
#close footer{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:0 var(--gutter);font:400 var(--s0)/1.6 var(--mono);letter-spacing:.06em;color:var(--dim);flex-wrap:wrap}
#close footer a{text-decoration:none;color:var(--text-2);margin-right:18px;opacity:.8;transition:opacity .25s ease}
#close footer a:hover{opacity:1}
#close footer .cols{display:flex;gap:36px;flex-wrap:wrap}
/* ── reduced motion · the film jumps to its end state; scroll travels remain (they are scroll-driven) ── */
@media (prefers-reduced-motion:reduce){ .rev{transition:none} #grain{display:none} }
/* ── short viewports (a laptop window under 760 px): the scale steps down and the bands tighten ── */
@media (max-height:760px) and (min-width:761px){
:root{--s7:clamp(56px,8.5vw + 8px,120px);--s6:clamp(44px,6vw + 10px,86px);--s5:clamp(34px,4vw + 12px,60px);--s4:clamp(28px,2.6vw + 12px,44px);--s3:clamp(22px,1.6vw + 14px,30px)}
#hero .wm{bottom:clamp(16px,3vh,32px)}
#seq .panel{padding:12px 18px 12px}
#seq .top{margin-bottom:8px}
#seq .cell{height:clamp(18px,2.4vh + 6px,26px)}
#seq .steps{margin-top:4px;height:12px}
#seq .note{max-width:22ch}
#connect .band .port span{max-width:18ch}
#flip .plate{width:min(40vw,380px);font-size:10px;line-height:1.5}
#flip .plate .row{padding:5px 0}
#close .cta{margin-bottom:3vh}
}
/* ── phone ── */
@media (max-width:760px){
:root{--nav:56px}

/* ═══════════ OP–XY · the background ═══════════
   A full-screen shader rendered BEFORE the product: drifting smoke in a dark studio, the key light's
   beam cut through it (its origin and direction are the real key light, projected, so the beam sweeps
   with the orbit during the entrance), a pool of light under the product, and the light act's grey
   sweep. The 3D floor only catches the shadow, so the background can never occlude the product. */
function buildBackground() {
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const uniforms = {
    uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) },
    uBeamO: { value: new THREE.Vector2(-0.2, 1.2) }, uBeamD: { value: new THREE.Vector2(0.5, -0.8) },
    uPool: { value: new THREE.Vector2(0.5, 0.55) }, uPoolR: { value: 0.35 },
    uOrbit: { value: 0 }, uAmbient: { value: 0 }, uGround: { value: 0 }, uPointer: { value: new THREE.Vector2(0, 0) },
    uPulse: { value: 0 }, uSmoke: { value: 1 }, uPoolA: { value: 1 },
  };
  const mat = new THREE.ShaderMaterial({
    uniforms, depthWrite: false, depthTest: false,
    vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      precision highp float;
      uniform float uTime, uPoolR, uOrbit, uAmbient, uGround, uPulse, uSmoke, uPoolA; uniform vec2 uRes, uBeamO, uBeamD, uPool, uPointer;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
      float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i &lt; 4; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }
      void main(){
        vec2 uv = gl_FragCoord.xy / uRes;              /* 0..1, y up */
        float asp = uRes.x / uRes.y;
        vec2 q = vec2((uv.x - 0.5) * asp, uv.y - 0.5);   /* aspect-true, centred */
        /* smoke · two drifting fbm layers, warped once, slow */
        vec2 drift = vec2(uTime * 0.018, uTime * 0.011) + uPointer * 0.03;
        vec2 w = q * 1.6 + drift;
        float n1 = fbm(w + fbm(w * 0.7 + uTime * 0.02) * 0.6);
        float n2 = fbm(q * 3.1 - drift * 1.4 + 4.0);
        float smoke = clamp((n1 * 0.75 + n2 * 0.35 - 0.3) * 1.5, 0.0, 1.0) * uSmoke;
        /* the beam · a cone from the key light's screen position along its direction */
        vec2 bo = vec2((uBeamO.x - 0.5) * asp, uBeamO.y - 0.5);
        vec2 bd = normalize(vec2(uBeamD.x * asp, uBeamD.y));
        vec2 v = q - bo; float along = dot(v, bd); float perp = dot(v, vec2(-bd.y, bd.x));
        float width = 0.09 + max(along, 0.0) * 0.30;
        float beam = exp(-(perp * perp) / (width * width)) * smoothstep(-0.1, 0.25, along) * exp(-max(along, 0.0) * 0.28);
        beam *= (0.3 + 1.1 * smoke) * (0.3 + 0.7 * uOrbit) * (0.2 + 0.8 * uAmbient);
        /* the pool under the product */
        vec2 pv = q - vec2((uPool.x - 0.5) * asp, uPool.y - 0.5); pv.y *= 2.2;
        float pool = exp(-dot(pv, pv) / (uPoolR * uPoolR)) * uPoolA;
        /* dark act */
        float vig = smoothstep(1.25, 0.25, length(q * vec2(0.8, 1.1)));
        vec3 dark = vec3(0.007, 0.007, 0.009) + vec3(0.032, 0.032, 0.036) * smoke * (0.3 + 0.7 * uAmbient) * vig
                  + vec3(1.0, 0.94, 0.86) * beam * 0.7
                  + vec3(0.07, 0.068, 0.066) * pool * (0.2 + 0.8 * uAmbient) * (1.0 + 0.6 * uPulse);
        /* light act · a studio sweep: bright under the product, falling to the press grey at the edges */
        vec3 grey = mix(vec3(0.42), vec3(0.72), pool * 0.9 + 0.1 * smoke) * (0.86 + 0.14 * vig) + vec3(0.06) * smoke * 0.5;
        vec3 col = mix(dark, grey, uGround);
        /* film grain, tiny, static per pixel plus a slow flicker */
        col += (hash(gl_FragCoord.xy + fract(uTime) * 7.0) - 0.5) * 0.012;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat); quad.frustumCulled = false; scene.add(quad);
  return { scene, camera, uniforms };
}
