<!DOCTYPE html><html lang="en" class=""><head>
  <script type="importmap">
{
  "imports": {
    "three": "./assets/vendor/cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "./assets/vendor/cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section - nav-1</title>
  <link rel="stylesheet" href="./assets/vendor/fonts.googleapis.com/css2">
  <style>
  :root{
    --paper:#fbfbfd;
    --paper-2:#f5f5f7;
    --ink:#1d1d1f;
    --ink-2:#6e6e73;
    --ink-3:#86868b;
    --line:rgba(0,0,0,.10);
    --accent:#c4551f;

    --paper-dark:#1d0f07;
    --ink-inv:#ffffff;
    --ink-inv-2:#e0c6b1;
    --line-inv:rgba(255,255,255,.18);

    --display:'Inter Tight','Inter',system-ui,sans-serif;
    --text:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    font-family:var(--text);
    color:var(--ink);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-feature-settings:"kern" 1,"liga" 1,"cv11" 1;
  }
  #bg{
    position:fixed; inset:0; z-index:0;
    background:#f5f5f7;
  }

  #c{position:fixed; inset:0; z-index:2; display:block}
  #grain{
    position:fixed; inset:0; z-index:5; pointer-events:none; opacity:.07;
    background-image:
      radial-gradient(circle at 25% 25%, rgba(255,255,255,.9) 0 .45px, transparent .6px),
      radial-gradient(circle at 75% 65%, rgba(0,0,0,.8) 0 .4px, transparent .55px);
    background-size:3px 3px,5px 5px;
    mix-blend-mode:overlay;
  }
  #scroller{position:relative; z-index:4; pointer-events:none}

  /* ---------- nav ---------- */
  body > nav{
    position:fixed; top:0; left:0; right:0; height:60px; z-index:20;
    display:flex; align-items:center; padding:0 30px;
    color:var(--ink);
    background:rgba(251,251,253,.72);
    backdrop-filter:saturate(150%) blur(16px);
    -webkit-backdrop-filter:saturate(150%) blur(16px);
    border-bottom:1px solid var(--line);
    font-size:12px; font-weight:400; letter-spacing:-.01em;
    transition:background .6s ease, color .6s ease, border-color .6s ease;
  }
  body > nav .links{display:flex; gap:26px; flex:1}
  body > nav .links a{color:inherit; text-decoration:none; opacity:.62; transition:opacity .3s}
  body > nav .links a:hover{opacity:1}
  body > nav .logo{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:var(--display); font-weight:600; font-size:14px; letter-spacing:.34em;
    padding-left:.34em; color:inherit; text-decoration:none;
  }
  body > nav .right{display:flex; gap:20px; align-items:center; justify-content:flex-end; flex:1}
  body > nav .right svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.4; opacity:.72}
  body > nav .iconbtn{
    display:flex; align-items:center; justify-content:center; border:0; background:none;
    color:inherit; cursor:pointer; padding:8px; margin:-8px;
  }
  body > nav .buy{
    -webkit-appearance:none; appearance:none; background:transparent; color:inherit; cursor:pointer;
    font-size:12px; letter-spacing:-.01em; font-weight:400; padding:6px 14px;
    border:1px solid var(--line); border-radius:100px; transition:.35s;
  }
  body > nav .buy:hover{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  :where(a,button,input):focus-visible{outline:2px solid var(--accent); outline-offset:3px}


  /* ---------- overlays ---------- */
  #overlays{position:fixed; inset:60px 0 0 0; z-index:10; pointer-events:none}
  .ov{position:absolute; inset:0; opacity:0; will-change:opacity}
  .slot{position:absolute; max-width:min(32vw,470px)}
  .slot.left{left:7vw; top:50%; transform:translateY(-50%)}
  .slot.right{right:7vw; top:50%; transform:translateY(-50%); text-align:right}
  .slot.center{left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; max-width:70vw}
  .slot.hero{left:8vw; top:29%; max-width:min(46vw,620px)}
  .slot.herocentre{
    left:50%; top:7.5vh; transform:translateX(-50%); text-align:center;
    width:min(62vw,680px); height:calc(100vh - 60px - 7.5vh);
  }
  .slot.herocentre h1{
    font-size:clamp(24px,2.7vw,44px); font-weight:600; letter-spacing:-.035em; line-height:1.12;
  }
  .slot.herocentre .lede{
    margin-top:16px; font-size:17px; line-height:1.5; color:var(--ink-2); letter-spacing:-.01em;
    max-width:64ch; margin-left:auto; margin-right:auto;
  }

  .eyebrow{
    font-size:12px; font-weight:600; letter-spacing:.004em; text-transform:none;
    color:#b06a2c; margin-bottom:14px;
  }

  h1,h2,.stat{font-family:var(--display); font-variant-numeric:tabular-nums}
  h1{font-size:clamp(44px,5.6vw,96px); font-weight:600; letter-spacing:-.045em; line-height:1.03}
  h1 .thin{display:block; font-weight:400; letter-spacing:-.03em; color:var(--ink-2); font-size:.5em; margin-top:.24em}
  h2{font-size:clamp(34px,3.9vw,68px); font-weight:600; letter-spacing:-.04em; line-height:1.05}
  h2 .thin{display:block; font-weight:400; color:var(--ink-2); font-size:.58em; letter-spacing:-.028em; margin-top:.14em}
  .kicker{
    font-size:12px; font-weight:600; letter-spacing:.004em;
    color:#b06a2c; margin-bottom:12px;
  }
  .stat{font-size:clamp(40px,4.4vw,76px); font-weight:600; letter-spacing:-.045em; line-height:1}
  .stat .unit{
    display:block; margin-top:12px; font-family:var(--text);
    font-size:11px; font-weight:400; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  }
  p.body{
    font-size:17px; line-height:1.53; color:var(--ink-2); font-weight:400;
    max-width:34ch; margin-top:24px; letter-spacing:-.01em;
  }
  .slot.right p.body{margin-left:auto}
  .rule{width:54px; height:1px; margin-top:22px; background:var(--line)}
  .slot.right .rule{margin-left:auto}

  .heroactions{
    position:absolute; left:50%; bottom:8vh; transform:translateX(-50%);
    display:flex; align-items:center; gap:16px; white-space:nowrap;
  }
  .heroactions .cta{margin:0; border:0; cursor:pointer; font-family:var(--text)}
  .heroproof{font-size:10.5px; letter-spacing:.04em; color:var(--ink-2)}

  #fallback{
    position:relative; z-index:6; min-height:100vh; padding:120px 7vw 80px;
    display:none; align-items:center; background:linear-gradient(180deg,#fafafb,#f1f1f4);
  }
  #fallback .fallbackcopy{max-width:620px}
  #fallback h1{font-size:clamp(46px,7vw,96px)}
  #fallback p{margin-top:22px; max-width:48ch; color:var(--ink-2); font-size:18px; line-height:1.55}
  #fallback .cta{text-decoration:none; margin-top:28px}
  body.fallback #fallback{display:flex}
  body.fallback #c,body.fallback #overlays,body.fallback #scroller,body.fallback #rail,
  body.fallback #railmeta,body.fallback #labels,body.fallback #scrollcue,body.fallback #bar{display:none}


  .light h1,.light h2,.light .stat{color:var(--ink-inv)}
  .light .eyebrow,.light .kicker,.light .stat .unit{color:var(--ink-inv-2)}
  .light h1 .thin,.light h2 .thin{color:var(--ink-inv-2)}
  .light p.body{color:var(--ink-inv-2)}
  .light .rule{background:var(--line-inv)}

  /* ---------- the press control ---------- */
  .press{
    -webkit-appearance:none; appearance:none; pointer-events:auto; cursor:pointer;
    display:inline-flex; align-items:center; gap:11px; margin-top:26px;
    padding:13px 24px 13px 18px; border-radius:100px;
    border:1px solid var(--line); background:rgba(255,255,255,.55);
    font-family:var(--text); font-size:10px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink);
    transition:background .35s, border-color .35s, color .35s;
  }
  .press:hover{background:#fff}
  .press .dot{
    width:7px; height:7px; border-radius:50%; background:var(--ink-3);
    transition:background .35s, box-shadow .35s;
  }
  .press.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .press.on .dot{background:#ffd7ae; box-shadow:0 0 0 4px rgba(255,215,174,.28)}
  .readout{
    display:flex; align-items:baseline; gap:8px; margin-top:26px;
    font-family:var(--display); font-variant-numeric:tabular-nums;
  }
  .readout #tempread{font-size:clamp(38px,3.6vw,58px); font-weight:500; letter-spacing:-.035em; line-height:1}
  .readout .deg{font-size:18px; font-weight:400; color:var(--ink-2)}
  .readout .rstate{
    margin-left:12px; font-family:var(--text); font-size:9.5px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
  }

  /* ---------- footer ---------- */
  #footer{
    position:relative; z-index:16; background:var(--paper);
    border-top:1px solid var(--line); padding:0 7vw 3vh;
    min-height:100vh; display:flex; flex-direction:column;
  }
  .fcta{
    display:flex; align-items:flex-end; justify-content:space-between; gap:6vw; flex-wrap:wrap;
    padding:9vh 0 7vh; border-bottom:1px solid var(--line);
  }
  .fcta h2{font-family:var(--display); font-weight:300; font-size:clamp(34px,4.4vw,72px);
           letter-spacing:-.035em; line-height:1.02; margin-top:14px}
  .fcta h2 b{font-weight:500}
  .fctaR{display:flex; flex-direction:column; align-items:flex-start; gap:18px}
  .fctaprice{display:flex; align-items:baseline; gap:14px}
  .fctaprice .price{font-family:var(--display); font-size:30px; font-weight:500; letter-spacing:-.03em}
  .fctaprice span:last-child{font-size:10.5px; letter-spacing:.06em; color:var(--ink-3)}
  .fcta .cta{margin-top:0; border:0; cursor:pointer; font-family:var(--text);
             transition:transform .3s, background .3s}
  .fcta .swatches{margin-top:0}
  .fmain{padding-top:8vh}
  .fmain{display:flex; gap:8vw; align-items:flex-start; flex-wrap:wrap}
  .fbrand{flex:1 1 340px; max-width:460px}
  .flogo{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:.34em; padding-left:.34em}
  .fbrand p{margin-top:18px; font-size:12.5px; line-height:1.75; color:var(--ink-2); max-width:44ch}
  .fnews{display:flex; gap:10px; margin-top:26px; max-width:400px}
  .fnews input{
    flex:1; background:none; border:0; border-bottom:1px solid var(--line);
    padding:11px 2px; font-family:var(--text); font-size:12.5px; color:var(--ink); outline:none;
    transition:border-color .3s;
  }
  .fnews input:focus{border-bottom-color:var(--ink)}
  .fnews input::placeholder{color:var(--ink-3)}
  .fnews button{
    -webkit-appearance:none; appearance:none; cursor:pointer; border:0; border-radius:100px;
    background:var(--ink); color:#fbfbfa; padding:11px 22px;
    font-family:var(--text); font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    transition:transform .3s, background .3s;
  }
  .fnews button:hover{transform:translateY(-1px)}
  .fnote{margin-top:12px; font-size:10px; letter-spacing:.06em; color:var(--ink-3); transition:color .3s}
  .fnote.done{color:var(--accent)}
  .fcols{display:flex; gap:5vw; flex:1 1 380px; justify-content:flex-end; flex-wrap:wrap}
  .fcols div{display:flex; flex-direction:column; gap:11px; min-width:110px}
  .fcols h4{
    font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
    font-weight:500; margin-bottom:5px;
  }
  .fcols a{font-size:12.5px; color:var(--ink-2); text-decoration:none; transition:color .25s}
  .fcols a:hover{color:var(--ink)}
  .fbase{
    display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;
    margin-top:8vh; padding-top:22px; border-top:1px solid var(--line);
    font-size:10px; letter-spacing:.08em; color:var(--ink-3);
  }
  .fsoc{display:flex; gap:20px}
  .fsoc a{color:var(--ink-3); text-decoration:none; transition:color .25s}
  .fsoc a:hover{color:var(--ink)}

  /* ---------- sticky buy bar ---------- */
  #buybar{
    position:fixed; left:0; right:0; bottom:0; z-index:24;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    padding:14px 30px; border-top:1px solid var(--line);
    background:rgba(251,251,253,.82); backdrop-filter:saturate(160%) blur(18px);
    -webkit-backdrop-filter:saturate(160%) blur(18px);
    transform:translateY(105%); opacity:0; pointer-events:none;
    transition:transform .65s cubic-bezier(.16,.84,.28,1), opacity .5s ease;
  }
  #buybar.on{transform:none; opacity:1; pointer-events:auto}
  .bbL{display:flex; align-items:baseline; gap:12px; min-width:0}
  .bbL b{font-family:var(--display); font-size:15px; font-weight:600; letter-spacing:-.02em}
  .bbL span{font-size:12px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bbL em{font-style:normal; color:var(--ink)}
  .bbR{display:flex; align-items:center; gap:20px}
  .bbprice{font-family:var(--display); font-size:16px; font-weight:600; letter-spacing:-.02em}
  #buybar .swatches{margin-top:0; gap:8px}
  #buybar .sw{width:22px; height:22px}
  #buybar .sw i{inset:2px}
  .bbcta{
    -webkit-appearance:none; appearance:none; cursor:pointer; border:0; border-radius:100px;
    background:var(--ink); color:#fbfbfd; padding:11px 22px;
    font-family:var(--text); font-size:13px; font-weight:500; letter-spacing:-.01em;
    transition:transform .3s, background .3s;
  }
  .bbcta:hover{transform:translateY(-1px)}
  .bbcta.done{background:#34a853}
  body.bb #chat{bottom:80px}
  @media (max-width:860px){
    #buybar{padding:11px 16px; gap:12px}
    .bbL span{display:none}
    .bbR{gap:12px}
    #buybar .swatches{display:none}
    .bbcta{padding:10px 18px; font-size:12.5px}
    body.bb #chat{bottom:74px}
  }

  /* ---------- support chat ---------- */
  #chat{position:fixed; right:26px; bottom:26px; z-index:30; pointer-events:none}
  #chatbtn{
    pointer-events:auto; cursor:pointer; -webkit-appearance:none; appearance:none;
    display:flex; align-items:center; gap:9px; padding:12px 18px; border-radius:100px;
    border:1px solid var(--line); background:rgba(255,255,255,.82); backdrop-filter:blur(12px);
    color:var(--ink); font-family:var(--text); font-size:10px; font-weight:500;
    letter-spacing:.12em; text-transform:uppercase;
    box-shadow:0 6px 24px rgba(17,19,21,.07);
    transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s, opacity .3s;
  }
  #chatbtn:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(17,19,21,.12)}
  #chat.open #chatbtn{opacity:0; pointer-events:none; transform:translateY(8px)}
  #chatpanel{
    position:absolute; right:0; bottom:calc(100% + 12px);
    pointer-events:none; opacity:0; transform:translateY(12px) scale(.98);
    transform-origin:100% 100%; width:min(340px,86vw);
    border:1px solid var(--line); border-radius:16px; overflow:hidden;
    background:rgba(251,251,253,.94); backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(17,19,21,.14);
    transition:opacity .4s ease, transform .45s cubic-bezier(.2,.7,.2,1);
  }
  #chat.open #chatpanel{opacity:1; transform:none; pointer-events:auto}
  .chead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
         padding:16px 16px 12px; border-bottom:1px solid var(--line)}
  .chead b{font-family:var(--display); font-size:13px; font-weight:500; display:block}
  .chead span{display:flex; align-items:center; gap:6px; font-size:9.5px; letter-spacing:.08em; color:var(--ink-3); margin-top:3px}
  .chead .dot{width:5px; height:5px; border-radius:50%; background:#4fae6b; display:inline-block}
  #chatclose{-webkit-appearance:none; appearance:none; background:none; border:0; cursor:pointer;
             font-size:19px; line-height:1; color:var(--ink-3); padding:0 2px}
  .clog{padding:14px 16px; display:flex; flex-direction:column; gap:9px; max-height:230px; overflow-y:auto}
  .msg{font-size:12px; line-height:1.6; padding:10px 13px; border-radius:13px; max-width:88%}
  .msg.them{background:#ececeb; color:var(--ink-2); border-bottom-left-radius:4px}
  .msg.me{background:var(--ink); color:#fbfbfa; align-self:flex-end; border-bottom-right-radius:4px}
  .msg.typing span{display:inline-block; width:5px; height:5px; margin-right:3px; border-radius:50%;
                   background:var(--ink-3); animation:blink 1.2s infinite}
  .msg.typing span:nth-child(2){animation-delay:.18s}
  .msg.typing span:nth-child(3){animation-delay:.36s; margin-right:0}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .cqs{display:flex; flex-wrap:wrap; gap:7px; padding:0 16px 16px}
  .cq{
    -webkit-appearance:none; appearance:none; cursor:pointer; background:none;
    border:1px solid var(--line); border-radius:100px; padding:7px 12px;
    font-family:var(--text); font-size:10.5px; color:var(--ink-2); transition:.25s;
  }
  .cq:hover{border-color:var(--ink); color:var(--ink)}

  @media (max-width:860px){
    #footer{padding:0 6vw 96px}
    .fcta{padding:8vh 0 6vh; gap:26px}
    .fctaR{width:100%}
    .fmain{padding-top:6vh}
    .fmain{gap:6vh}
    .fcols{justify-content:flex-start; gap:9vw}
    .fbase{margin-top:6vh}
    #chat{right:14px; bottom:14px}
    #chatbtn span{display:none}
    #chatbtn{padding:13px}
  }

  /* ---------- headline reveal ---------- */
  .w{display:inline-block; overflow:hidden; vertical-align:bottom}
  .w i{
    display:inline-block; font-style:normal; transform:translateY(0.9em);
    opacity:0; filter:blur(6px);
    transition:transform .95s cubic-bezier(.16,.84,.28,1), opacity .8s ease, filter .8s ease;
    transition-delay:calc(var(--i) * 42ms);
  }
  .ov.in .w i{transform:none; opacity:1; filter:blur(0)}
  .ov .lede,.ov p.body,.ov .stat,.ov .kicker,.ov .eyebrow{
    opacity:0; transform:translateY(14px);
    transition:opacity .8s ease .18s, transform .9s cubic-bezier(.16,.84,.28,1) .18s;
  }
  .ov.in .lede,.ov.in p.body,.ov.in .stat,.ov.in .kicker,.ov.in .eyebrow{opacity:1; transform:none}

  /* ---------- statement moments ---------- */
  .statement{
    position:absolute; left:50%; top:12vh; transform:translateX(-50%);
    width:min(78vw,940px); text-align:center;
  }
  .statement h2{
    font-size:clamp(40px,5.4vw,92px); font-weight:600; letter-spacing:-.045em; line-height:1.04;
  }
  .statement h2 .thin{display:block; font-weight:600; color:var(--ink-3); font-size:1em; margin:0}
  .statement .lede{
    margin:24px auto 0; max-width:56ch; font-size:19px; line-height:1.48;
    color:var(--ink-2); letter-spacing:-.01em;
  }

  /* ---------- testimonials ---------- */
  .testi{position:absolute; left:7vw; top:50%; transform:translateY(-50%); max-width:min(46vw,620px)}
  .thead{font-size:clamp(26px,2.8vw,46px)}
  .thead .thin{display:inline; font-weight:300; color:var(--ink-2); margin-left:.28em}
  .tstats{display:flex; gap:38px; margin-top:26px; padding-bottom:26px; border-bottom:1px solid var(--line)}
  .tstats b{
    display:block; font-family:var(--display); font-size:clamp(24px,2.4vw,38px); font-weight:500;
    letter-spacing:-.03em; font-variant-numeric:tabular-nums;
  }
  .tstats span{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
  .tcards{margin-top:26px; overflow:hidden}
  .tcardrow{display:flex; gap:18px; will-change:transform}
  .tcard{
    flex:0 0 min(27vw,330px); padding:24px 24px 22px; border:1px solid var(--line);
    border-radius:16px; background:rgba(255,255,255,.62); backdrop-filter:blur(8px);
    display:flex; flex-direction:column; gap:16px;
    transition:transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s, background .45s;
  }
  .tcard:hover{transform:translateY(-4px); background:rgba(255,255,255,.85);
               box-shadow:0 14px 40px rgba(17,19,21,.08)}
  .tstars{display:flex; align-items:center; gap:9px; color:#c8873f}
  .tstars em{font-style:normal; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
  .tcard blockquote{font-size:12.5px; line-height:1.72; color:var(--ink-2); flex:1}
  .tcard figcaption{display:flex; align-items:center; gap:12px; padding-top:16px; border-top:1px solid var(--line)}
  .tav{
    position:relative; width:40px; height:40px; flex:none; border-radius:50%;
    overflow:hidden; background:#e2e2e1; display:block;
  }
  .tav::before{

  if (['split','split-sleek','specs','closing','testi','faq','statement'].includes(s.slot)) d.innerHTML = s.html;
  else if (s.slot === 'none') d.innerHTML = '';
  else d.innerHTML = `<div class="slot ${s.slot}">${s.html}</div>`;
  ovRoot.appendChild(d);
  return d;
});
/* numbered eyebrow above the first copy block of each section */
ovEls.forEach((d,i)=>{
  const sec = SECTIONS[i];
  if (!sec.label || i === 0 || ['none','specs','closing','testi','faq','statement'].includes(sec.slot)) return;
  const host = d.querySelector('.slot');
  if (!host) return;
  const eb = document.createElement('div');
  eb.className = 'eyebrow';
  eb.textContent = sec.label;
  host.insertBefore(eb, host.firstChild);
});
/* hairline under body copy, a quiet full stop */
ovEls.forEach(d => d.querySelectorAll('p.body').forEach(pEl => {

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
const renderRatio = () => Math.min(devicePixelRatio, innerWidth < 860 ? 1.5 : 2);
renderer.setPixelRatio(renderRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,1.9,2.3);

/* ---------- procedural studio environment ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envRT = null, envMixCached = -1;

function makeEnvCanvas(mix){
  const w = 2048, h = 1024;
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const g = cv.getContext('2d');
  const lerpC = (a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  const rgb = c=>`rgb(${c[0]},${c[1]},${c[2]})`;
  const dip = 1 - 0.30*Math.sin(Math.PI*mix);
  const D = c => c.map(v => Math.round(v*dip));
  const top  = D(lerpC([255,255,255],[236,158,96], mix));
  const mid  = D(lerpC([236,236,235],[150,64,22],  mix));
  const bot  = D(lerpC([30,31,33],   [26,12,6],    mix));
  const grad = g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, rgb(top));
  grad.addColorStop(0.55, rgb(mid));
  grad.addColorStop(1, rgb(bot));
  g.fillStyle = grad; g.fillRect(0,0,w,h);
  // soft box highlights (they become the long specular streaks on the metal)
  const boxes = [
    [0.09,0.34,0.055,0.44],   // tall softbox, camera left
    [0.26,0.26,0.030,0.34],
    [0.50,0.22,0.075,0.30],   // top key
    [0.72,0.32,0.048,0.42],   // tall softbox, camera right
    [0.91,0.30,0.030,0.36],
    [0.40,0.66,0.220,0.10],   // low bounce
  ];
  for (const [u,v,rw,rh] of boxes){
    const rg = g.createRadialGradient(u*w, v*h, 0, u*w, v*h, Math.max(rw*w, rh*h));
    const bright = mix > 0.5 ? 'rgba(255,214,176,' : 'rgba(255,255,255,';
    rg.addColorStop(0, bright+(1.0)+')');
    rg.addColorStop(0.4, bright+(0.45)+')');
    rg.addColorStop(1, bright+'0)');
    g.save(); g.translate(u*w, v*h); g.scale(1, (rh*h)/(rw*w)); g.translate(-u*w,-v*h);
    g.fillStyle = rg; g.fillRect(0,0,w,h); g.restore();
  }
  // dark floor band for contrast on the lower half of the body
  const dg = g.createLinearGradient(0,h*0.62,0,h);
  dg.addColorStop(0,'rgba(0,0,0,0)'); dg.addColorStop(1,'rgba(0,0,0,0.75)');
  g.fillStyle = dg; g.fillRect(0,h*0.62,w,h*0.38);
  return cv;
}

  tex.colorSpace = THREE.SRGBColorSpace;
  const rt = pmrem.fromEquirectangular(tex);

}

function speckleTexture(){
  const s = 1024;

  const g = cv.getContext('2d');
  g.fillStyle = '#6e6e6e'; g.fillRect(0,0,s,s);
  const img = g.getImageData(0,0,s,s); const d = img.data;
  for (let i=0;i<d.length;i+=4){
    const n = 110 + (Math.random()*Math.random()*145);
    d[i]=d[i+1]=d[i+2]=n;
  }
  g.putImageData(img,0,0);
  // sparse bright specks — the fine metallic glitter of the powder coat
  for (let i=0;i<9000;i++){
    g.fillStyle = `rgba(255,255,255,${0.25+Math.random()*0.6})`;
    g.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4,8);
  return t;
}

/* fine, low-contrast grain — the texture of a cured powder coat */
function coatTexture(){
  const S = 1024;
  const cv = document.createElement('canvas'); cv.width=cv.height=S;
  const g = cv.getContext('2d');
  const img = g.createImageData(S,S); const d = img.data;

    const n = 234 + (Math.random()-0.5)*16;
    d[i]=d[i+1]=d[i+2]=n; d[i+3]=255;
  }
  g.putImageData(img,0,0);
  for (let i=0;i<26000;i++){                 // orange-peel specks
    const a = 0.04 + Math.random()*0.07;
    g.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
    const r = 0.6 + Math.random()*1.7;
    g.beginPath(); g.arc(Math.random()*S, Math.random()*S, r, 0, Math.PI*2); g.fill();
  }
  const t = new THREE.CanvasTexture(cv);

function textTexture(text, {w=1024,h=512,font='800 250px Inter, sans-serif',rot=0}={}){

function powerGlyphTexture(){
  const s = 512, c = s/2, r = 130;
  const cv = document.createElement('canvas'); cv.width=cv.height=s;

  g.strokeStyle = '#fff'; g.lineWidth = 42; g.lineCap = 'round';

  g.arc(c, c + 26, r, -Math.PI/2 + 0.42, -Math.PI/2 - 0.42, false);

function powerGlowTexture(){

function steamTexture(){
  const s = 512;
  const cv = document.createElement('canvas'); cv.width=cv.height=s;
  const g = cv.getContext('2d');
  g.strokeStyle = '#fff'; g.lineWidth = 30; g.lineCap = 'round';
  const curl = (x, amp, top, bot) => {
    g.beginPath(); g.moveTo(x, bot);
    g.bezierCurveTo(x - amp, bot - (bot-top)*0.32, x + amp, bot - (bot-top)*0.62, x, top);
    g.stroke();
  };
  curl(s*0.5, 62, 70, 442);
  curl(s*0.5 - 118, 46, 150, 430);
  curl(s*0.5 + 118, 46, 150, 430);
  const blurred = document.createElement('canvas'); blurred.width=blurred.height=s;
  const b = blurred.getContext('2d');
  b.filter = 'blur(9px)'; b.drawImage(cv,0,0);
  b.filter = 'blur(22px)'; b.globalAlpha = 0.7; b.drawImage(cv,0,0);
  return new THREE.CanvasTexture(blurred);
}
const steamTex = steamTexture();

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function state(p){
  const f = p * (N-1);
  const i = clamp(Math.floor(f), 0, N-2);
  const t = smooth(clamp(f - i, 0, 1));
  const a = SECTIONS[i], b = SECTIONS[i+1];
  const v3 = (ka,kb)=>[lerp(ka[0],kb[0],t), lerp(ka[1],kb[1],t), lerp(ka[2],kb[2],t)];
  return {
    cam: v3(a.cam,b.cam), tgt: v3(a.tgt,b.tgt),
    rotY: lerp(a.rotY,b.rotY,t), tiltZ: lerp(a.tiltZ,b.tiltZ,t),
    gap: lerp(a.gap,b.gap,t), glow: lerp(a.glow,b.glow,t),
    icons: lerp(a.icons,b.icons,t), mix: lerp(a.mix,b.mix,t),
    dim: lerp(a.dim||0, b.dim||0, t),
    parts: lerp(a.parts||0, b.parts||0, t),
    f
  };
}

/* split headlines into words so they can rise one after another on entry */
(function splitHeadlines(){
  const wrap = node => {
    const out = document.createDocumentFragment();
    node.textContent.split(/(\s+)/).forEach(part => {
      if (!part.trim()){ out.appendChild(document.createTextNode(part)); return; }
      const w = document.createElement('span'); w.className = 'w';
      const i = document.createElement('i'); i.textContent = part;
      w.appendChild(i); out.appendChild(w);
    });
    node.replaceWith(out);
  };
  const walk = el => [...el.childNodes].forEach(n => {
    if (n.nodeType === 3) wrap(n);
    else if (n.nodeType === 1 && !n.classList.contains('w')) walk(n);
  });
  ovEls.forEach(ov => ov.querySelectorAll('h1, h2').forEach(h => {
    walk(h);
    let k = 0;
    h.querySelectorAll('.w i').forEach(i => i.style.setProperty('--i', k++));
  }));
})();

/* ---------- magnetic pull on the primary buttons ---------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.cta, #chatbtn, .fnews button, .bbcta').forEach(el => {
  el.addEventListener('pointermove', e => {
    if (reduceMotion) return;
    const r = el.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width/2)) / r.width;
    const dy = (e.clientY - (r.top + r.height/2)) / r.height;
    el.style.transform = `translate(${dx*7}px, ${dy*5}px)`;
  });
  el.addEventListener('pointerleave', () => { el.style.transform = ''; });
});

let time = 0;
let pageVisible = !document.hidden;
document.addEventListener('visibilitychange', () => {
  pageVisible = !document.hidden;
  if (pageVisible) requestAnimationFrame(frame);
});
function frame(){
  if (!pageVisible) return;
  requestAnimationFrame(frame);
  time += 0.016;
  cur += (target - cur) * (reduceMotion ? 0.22 : 0.075);
  const s = state(cur);

  const narrow = camera.aspect < 1.25;
  const k = narrow ? Math.pow(1.25/camera.aspect, 0.72) : 1;
  const tx = narrow ? 0 : s.tgt[0];
  camera.position.set(
    tx + (s.cam[0]-s.tgt[0])*k,
    s.tgt[1] + (s.cam[1]-s.tgt[1])*k,
    (s.cam[2]-s.tgt[2])*k
  );
  camera.lookAt(tx, s.tgt[1], s.tgt[2]);
  if (!reduceMotion){
    camera.position.x += Math.sin(time*0.35)*0.012;
    camera.position.y += Math.sin(time*0.27)*0.008;
  }

  mug.rotation.y = s.rotY;
  mug.rotation.z = s.tiltZ;
  mug.position.y = -s.tiltZ * 0.35;

  capGrp.position.y = CAP_BASE_Y + s.gap + Math.sin(time*0.8)*0.012*(s.gap>0.2?1:0);

  mug.updateMatrixWorld(true);

  const uvPre = smooth(clamp((s.mix - 0.22)/0.48, 0, 1));

  /* ---- the button: scroll gives it standby, the click gives it heat ---- */
  const glowPulse = 0.85 + Math.sin(time*2.1)*0.15;
  heat += (heatTarget - heat) * 0.045;                 // eased on click
  const standby = s.glow * 0.10;
  const lit = Math.max(standby, heat);

  glyphMat.color.setRGB(
    lerp(0.95, 1.0, lit), lerp(0.94, 0.58, lit), lerp(0.93, 0.24, lit)
  );
  glyphMat.opacity = 0.88 + lit*0.12;
  haloMat.opacity = clamp(lit*1.35, 0, 1) * glowPulse;
  haloMat.color.setRGB(1.15*lit, 0.55*lit, 0.22*lit);
  halo.scale.setScalar(1 + lit*0.16 + heat*0.10*Math.sin(time*2.4));
  btnGlow.material.opacity = lit * 0.30 * glowPulse;
  btnLight.intensity = lit * 0.45 * glowPulse;
  btnLight.position.set(0, capGrp.position.y + capH + 0.12 + mug.position.y, 0);

  /* finish crossfade */
  const F = FINISHES[finishIndex];
  finishCol.body.lerp(new THREE.Color(F.body), 0.08);
  finishCol.cap.lerp(new THREE.Color(F.cap), 0.08);
  finishCol.knurl.lerp(new THREE.Color(F.knurl), 0.08);
  finishCol.mark.lerp(new THREE.Color(F.mark), 0.08);
  finishCol.etch.lerp(new THREE.Color(F.etch), 0.08);
  bodyMat.color.copy(finishCol.body);
  capMat.color.copy(finishCol.cap);
  knurlBand.material.color.copy(finishCol.knurl);
  mark.material.color.copy(finishCol.mark);
  etch.material.color.copy(finishCol.etch);
  bodyMat.metalness += (F.metal - bodyMat.metalness) * 0.08;
  capMat.metalness  += (Math.max(0, F.metal-0.02) - capMat.metalness) * 0.08;
  bodyMat.roughness += (F.rough - bodyMat.roughness) * 0.08;
  capMat.roughness  += ((F.rough+0.14) - capMat.roughness) * 0.08;
  etch.material.opacity += (F.etchOp - etch.material.opacity) * 0.08;

  /* exploded parts + their labels */
  const parts = s.parts;
  neckRing.position.y = neckY + 0.058 + parts*0.13;
  gasket.position.y = -0.125 - parts*0.30;
  gasket.scale.setScalar(1 + parts*0.05);
  baseRing.position.y = 0.084 - parts*0.16;
  baseEdge.position.y = 0.1455 - parts*0.16;
  pad.position.y = 0.030 - parts*0.16;
  for (let i=0;i<labelEls.length;i++){
    const el = labelEls[i];
    if (parts < 0.05){ el.style.opacity = '0'; continue; }
    _lv.set(0.52, PART_LABELS[i].y(), 0).applyMatrix4(mug.matrixWorld).project(camera);
    el.style.left = ((_lv.x*0.5+0.5)*innerWidth + 26) + 'px';
    el.style.top  = ((-_lv.y*0.5+0.5)*innerHeight) + 'px';
    el.style.opacity = (parts * 0.95).toFixed(2);
  }

  /* status bar + state LEDs */
  const barLit = Math.max(lit, s.glow*0.35);
  barMat.opacity = clamp(barLit*1.25, 0, 1) * (0.8 + Math.sin(time*1.5)*0.14);
  barMat.color.setRGB(1.0, lerp(0.62,0.52,heat), lerp(0.30,0.20,heat));
  barGlow.material.opacity = barLit * 0.30;

  /* state LEDs on the cap */
  const heatShown = Math.max(heat, uvPre);
  const temp = 22 + heatShown * 35;
  leds.material.opacity = clamp(Math.max(lit, s.glow*0.5)*1.25, 0, 1) * (0.82 + Math.sin(time*1.4)*0.12);
  coffeeMat.emissive.setRGB(heatShown*0.055, heatShown*0.022, heatShown*0.004);
  if (tempEl) tempEl.textContent = String(Math.round(temp));
  if (stateEl) stateEl.textContent = heat > 0.55 ? 'Holding 57°' : (heat > 0.05 ? 'Heating…' : 'Off');

      mouth.x + pf.drift * t2 * 2.2 + Math.sin(time*0.6 + pf.seed*9)*0.05,
      mouth.y + 0.10 + t2 * 0.85,
      mouth.z + pf.drift * t2
    );

    const op = clamp((0.58 - d) / 0.24, 0, 1);

  /* testimonials travel sideways as the section passes */
  if (tRow){

      el.textContent = (to * smooth(clamp(local*2.4, 0, 1))).toFixed(dec);
    }
  }

  const active = Math.round(s.f);
  if (active !== lastActive){

    ticks[active].classList.add('on');

    railLabel.textContent = '/ ' + String(SECTIONS.length).padStart(2,'0');
    document.body.dataset.sectionIndex = String(active);

  }

  const wantBar = cur > 0.30 && cur < 0.94 && footerT < 0.15;
  if (wantBar !== barShown){
    barShown = wantBar;
    buyBar.classList.toggle('on', wantBar);
    document.body.classList.toggle('bb', wantBar);
  }

  /* hand over to the footer */
  const fade = 1 - footerT;

  railEl.style.opacity = fade.toFixed(3);

  labelRoot.style.opacity = fade.toFixed(3);


  bloom.strength = lerp(0.24, 0.44, Math.max(s.glow, uv));
  composer.render();
}

            setTestimonial(i);
            testTimer = setInterval(function() {
              setTestimonial((activeTestIndex + 1) % testImages.length);
            }, testDuration);
          });
        });

        setTestimonial(0);
        testTimer = setInterval(function() {
          setTestimonial((activeTestIndex + 1) % testImages.length);
        }, testDuration);
      }
    }

    // --- 7. HOVER BADGES INTERATIVOS & MICRO-INTERAÇÕES ---
    document.querySelectorAll('a[href*="/projects/"]').forEach(function(link) {
      const badge = link.querySelector('.bg-primary.w-fit.h-fit');
      if (badge) {
        badge.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        link.addEventListener('mouseenter', function() {
          badge.style.opacity = '1';
          badge.style.transform = 'scale(1.05)';
        });
        link.addEventListener('mouseleave', function() {
          badge.style.opacity = '0';
          badge.style.transform = 'scale(0.95)';
        });
      }
    });

    // --- 8. STACKING CARDS & METRIC STATS SLIDERS (15+ / 30+ SEM SOBREPOSIÇÃO) ---
    const stackingCards = Array.from(document.querySelectorAll('[data-stacking-cards-item]'));
    if (stackingCards.length > 1) {
      let activeCardIdx = 0;
      function renderStackingCard(idx) {
        activeCardIdx = (idx + stackingCards.length) % stackingCards.length;
        stackingCards.forEach(function(c, i) {
          c.style.transition = 'opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
          if (i === activeCardIdx) {
            c.style.opacity = '1';
            c.style.visibility = 'visible';
            c.style.transform = 'translateY(0px)';
            c.style.position = 'relative';
            c.style.pointerEvents = 'auto';
          } else {
            c.style.opacity = '0';
            c.style.visibility = 'hidden';
            c.style.transform = 'translateY(15px)';
            c.style.position = 'absolute';
            c.style.pointerEvents = 'none';
          }
        });

        // Atualiza indicadores numéricos como 01/02
        const navLines = document.querySelectorAll('.problem_stats_line, .problem_stats_navigation');
        navLines.forEach(function(nl) {
          const spans = nl.querySelectorAll('span, div');
          if (spans.length >= 2) {
            spans[0].textContent = String(activeCardIdx + 1).padStart(2, '0');
          }
        });
      }

      renderStackingCard(0);
      let cardTimer = setInterval(function() {
        renderStackingCard(activeCardIdx + 1);
      }, 4500);

      // Conecta botões/setas de navegação
      document.querySelectorAll('.problems_home_stats button, .problems_home_stats a, [class*="stats_nav"], .problems_stats_navigation').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          clearInterval(cardTimer);
          renderStackingCard(activeCardIdx + 1);
          cardTimer = setInterval(function() {
            renderStackingCard(activeCardIdx + 1);
          }, 4500);
        });
      });
    }

    // --- 9. SCROLL-LINKED TEXT HIGHLIGHT REVEAL ([data-highlight-text]) ---
    document.querySelectorAll('[data-highlight-text]').forEach(function(container) {
      if (container.dataset.highlightActivated) return;
      container.dataset.highlightActivated = 'true';
      const text = container.innerText.trim();
      const words = text.split(/\s+/);
      container.innerHTML = '';
      const wordSpans = words.map(function(w) {
        const span = document.createElement('span');
        span.textContent = w + ' ';
        span.style.display = 'inline';
        span.style.transition = 'color 0.35s ease, opacity 0.35s ease';
        span.style.color = '#71717a';
        span.style.opacity = '0.35';
        container.appendChild(span);
        return span;
      });

      function updateTextHighlight() {
        const rect = container.getBoundingClientRect();
        const winH = window.innerHeight;
        const progress = Math.min(Math.max((winH * 0.85 - rect.top) / (rect.height + winH * 0.35), 0), 1);
        const activeCount = Math.floor(progress * wordSpans.length);

        wordSpans.forEach(function(sp, i) {
          if (i <= activeCount) {
            sp.style.color = '#fafaf9';
            sp.style.opacity = '1';
          } else {
            sp.style.color = '#71717a';
            sp.style.opacity = '0.35';
          }
        });
      }

      window.addEventListener('scroll', updateTextHighlight, { passive: true });
      updateTextHighlight();
    });

    // --- 10. GAP SECTION / KINETIC IMAGE CAROUSEL & LETTER SCRUB ---
    const gapSection = document.querySelector('.gap_home_wrap, [class*="gap_wrap"]');
    if (gapSection) {
      const gapImages = Array.from(gapSection.querySelectorAll('.gap_home_image, [class*="gap_image"]'));
      if (gapImages.length > 1) {
        let gapIdx = 0;
        gapImages.forEach(function(img, i) {
          img.style.transition = 'opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1)';
          img.style.opacity = i === 0 ? '1' : '0';
        });
        setInterval(function() {
          gapImages.forEach(function(img) { img.style.opacity = '0'; });
          gapIdx = (gapIdx + 1) % gapImages.length;
          gapImages[gapIdx].style.opacity = '1';
        }, 900);
      }
    }

    // --- 12. MOTOR UNIVERSAL DE REVELAÇÃO WEBFLOW (data-anim="split", data-anim="element", data-anim="stagger", data-anim="slideUp-once") ---
    if (typeof gsap !== 'undefined') {
      // 12.1 Data-anim split
      document.querySelectorAll('[data-anim="split"]').forEach(function(el) {
        if (el.closest('.amenities-slide-box')) return;
        try {
          if (typeof SplitText !== 'undefined') {
            const cleanText = el.getAttribute('aria-label') || el.textContent.trim();
            el.innerHTML = cleanText;
            const st = new SplitText(el, { type: 'lines', linesClass: 'split-line', mask: 'lines' });
            if (st.lines && st.lines.length > 0) {
              const triggerEl = el.closest('section, .wrap') || el;
              gsap.from(st.lines, {
                y: '100%',
                opacity: 0,
                duration: 0.8,
                stagger: 0.08,
                ease: 'power3.out',
                scrollTrigger: {
                  trigger: triggerEl,
                  start: 'top 90%',
                  once: true
                }
              });
            }
          }
        } catch(e) {}
      });

      // 12.2 Data-anim element e slideUp-once
      document.querySelectorAll('[data-anim="element"], [data-anim="slideUp-once"]').forEach(function(el) {
        if (el.closest('.amenities-slide-box')) return;
        const triggerEl = el.closest('section, .wrap') || el;
        gsap.fromTo(el, 
          { y: 30, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.8,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: triggerEl,
              start: 'top 90%',
              once: true
            }
          }
        );
      });

      // 12.3 Data-anim stagger
      document.querySelectorAll('[data-anim="stagger"]').forEach(function(el) {
        const children = Array.from(el.children).filter(function(child) {
          return !child.hasAttribute('data-dropdown-list') && !child.classList.contains('faq-dropdown-list');
        });
        if (children.length > 0) {
          const triggerEl = el.closest('section, .wrap') || el;
          gsap.fromTo(children,
            { y: 40, opacity: 0 },
            {
              y: 0,
              opacity: 1,
              duration: 0.8,
              stagger: 0.1,
              ease: 'power3.out',
              scrollTrigger: {
                trigger: triggerEl,
                start: 'top 90%',
                once: true
              }
            }
          );
        }
      });
      // 12.4 Data-anim img-overlay
      document.querySelectorAll('[data-anim="img-overlay"]').forEach(function(el) {
        gsap.to(el, {
          yPercent: -100,
          duration: 1.1,
          ease: 'power3.inOut',
          scrollTrigger: {
            trigger: el.parentElement || el,
            start: 'top 80%',
            once: true
          }
        });
      });

      // 12.5 Data-anim img-paralax / img-parallax (Parallax de imagens Webflow)
      document.querySelectorAll('[data-anim="img-paralax"], [data-anim="img-parallax"]').forEach(function(el) {
        gsap.fromTo(el,
          { yPercent: -10, scale: 1.1 },
          {
            yPercent: 10,
            scale: 1,
            ease: 'none',
            scrollTrigger: {
              trigger: el.closest('section, .wrap') || el,
              start: 'top bottom',
              end: 'bottom top',
              scrub: true
            }
          }
        );
      });

      // 12.6 FAQ Dropdown Hover & Click Engine
      document.querySelectorAll('.faq [data-dropdown]').forEach(function(dropdown) {
        dropdown.addEventListener('mouseenter', function() {
          dropdown.classList.add('is-active');
        });
        dropdown.addEventListener('mouseleave', function() {
          dropdown.classList.remove('is-active');
        });
        dropdown.addEventListener('click', function() {
          dropdown.classList.toggle('is-active');
        });
      });
    }

    console.log('✅ [Universal Scroll Director] Todos os subsistemas (SplitText, 3D Spinner, Curtains, Sliders, Highlights, Stacking Cards, Accordions, Webflow Reveals) ativados com sucesso.');
  });
})();
</script>
</body></html>
