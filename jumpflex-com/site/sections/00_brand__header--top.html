      /* 1. Supressão Completa de Cortinas de Transição e Preloaders (Anti-Blackscreen) */
      #transition-overlay, 
      [data-cover], 
      .transition-curtain,

      .w-preloader {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;
      }

      /* Desbloqueia position: sticky globalmente removendo overflow hostil dos ancestrais */
      html, body {
        overflow-x: clip !important;
        overflow-y: visible !important;
      }
      .page-wrapper, main, .main-wrapper, .container, .page-padding {
        overflow: visible !important;
      }

      /* Desbloqueia sliders de marcas / logos para rotação infinita */
      .brand-slider, .logo-slider, .partner-slider {
        display: flex !important;
        visibility: visible !important;
        opacity: 1 !important;
      }

      /* Reparo de layout para seções empilhadas e eliminação de spacers fantasmas */

        display: none !important;
      }

        height: auto !important;
      }
      section.cta, .cta {
        margin-top: 0 !important;
        position: relative !important;
        z-index: 10 !important;
      }
      section.faq, .faq {
        margin-top: 0 !important;
        position: relative !important;
        z-index: 5 !important;
      }

      /* Interatividade de hover fluida na FAQ */
      .faq [data-dropdown-list] {
        opacity: 0 !important;
        transform: translateX(24px) !important;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);

      }
      .faq [data-dropdown]:hover [data-dropdown-list],
      .faq [data-dropdown].is-active [data-dropdown-list] {
        opacity: 1 !important;

      .faq [data-dropdown]:hover .faq-dropdown-toggle h3,

      [data-amenities-anim="big-image"].is-first {

  <script>window.__reactRouterContext.streamController.enqueue("P17:[{\"_2532\":2533,\"_811\":2534,\"_2535\":2536},\"bottomline\",{\"_2654\":2655,\"_2656\":2657},[2642,2643],\"reviews\",[2537,2538,2539,2540,2541,2542,2543,2544,2545,2546,2547,2548],{\"_137\":2635,\"_2550\":2551,\"_1013\":803,\"_2552\":2636,\"_24\":2637,\"_2555\":282,\"_115\":2556,\"_2557\":2638,\"_2559\":2639,\"_2561\":282},{\"_137\":2628,\"_2550\":2551,\"_1013\":803,\"_2552\":2629,\"_24\":2630,\"_2555\":282,\"_115\":2556,\"_2557\":2631,\"_2559\":2632,\"_2561\":282},{\"_137\":2621,\"_2550\":2551,\"_1013\":803,\"_2552\":2622,\"_24\":2623,\"_2555\":282,\"_115\":2556,\"_2557\":2624,\"_2559\":2625,\"_2561\":282},{\"_137\":2614,\"_2550\":2551,\"_1013\":803,\"_2552\":2615,\"_24\":2616,\"_2555\":282,\"_115\":2556,\"_2557\":2617,\"_2559\":2618,\"_2561\":282},{\"_137\":2607,\"_2550\":-5,\"_1013\":803,\"_2552\":2608,\"_24\":2609,\"_2555\":282,\"_115\":2556,\"_2557\":2610,\"_2559\":2611,\"_2561\":282},{\"_137\":2600,\"_2550\":2551,\"_1013\":803,\"_2552\":2601,\"_24\":2602,\"_2555\":282,\"_115\":2556,\"_2557\":2603,\"_2559\":2604,\"_2561\":282},{\"_137\":2593,\"_2550\":2551,\"_1013\":803,\"_2552\":2594,\"_24\":2595,\"_2555\":11,\"_115\":2556,\"_2557\":2596,\"_2559\":2597,\"_2561\":282},{\"_137\":2586,\"_2550\":-5,\"_1013\":803,\"_2552\":2587,\"_24\":2588,\"_2555\":282,\"_115\":2556,\"_2557\":2589,\"_2559\":2590,\"_2561\":282},{\"_137\":2579,\"_2550\":-5,\"_1013\":803,\"_2552\":2580,\"_24\":2581,\"_2555\":282,\"_115\":2556,\"_2557\":2582,\"_2559\":2583,\"_2561\":282},{\"_137\":2576,\"_2550\":2551,\"_1013\":803,\"_2552\":2569,\"_24\":2570,\"_2555\":11,\"_115\":2556,\"_2557\":2577,\"_2559\":2578,\"_2561\":282},{\"_137\":2567,\"_2550\":2568,\"_1013\":803,\"_2552\":2569,\"_24\":2570,\"_2555\":11,\"_115\":2571,\"_2557\":2572,\"_2559\":2573,\"_2561\":282},{\"_137\":2549,\"_2550\":2551,\"_1013\":803,\"_2552\":2553,\"_24\":2554,\"_2555\":11,\"_115\":2556,\"_2557\":2558,\"_2559\":2560,\"_2561\":282},825185821,\"productId\",\"313148\",\"content\",\"We've had the basic 15ft model for a little over a year. It's been the hit of our cul-de-sac! It's large, sturdy, and endless hours of fun! Last week, the zipper on the safety net busted. I called customer service and Brooke handled the issue quick and seamless. We were less than a week outside the warranty and Brooke sent us a new safety net at no charge. A real person answered the phone, the issue was handled without any back and forth, and our new net should arrive today. This level of customer service is rare these days! I appreciate the help from Brooke and the entire Jump Flex team for making a quality product that kids can enjoy for years. Thank you!\",\"Great trampoline, Great customer service!\",\"verifiedBuyer\",\"2\",\"user\",{\"_137\":2562,\"_2563\":2564,\"_2565\":2566},\"createdAt\",\"2026-04-01T13:31:04\",\"isShop\",184945872,\"displayName\",\"Morgan S.\",\"reviewerType\",\"User\",826784822,\"48201042\",\"Quality components; easy setup; solid construction. We are very happy with our purchase.\",\"Quality components; easy setup; solid\",\"1\",{\"_137\":2574,\"_2563\":2575,\"_2565\":2566},\"2026-04-04T03:06:22\",185284955,\"Naomi H.\",826784848,{\"_137\":2574,\"_2563\":2575,\"_2565\":2566},\"2026-04-04T03:06:41\",828994616,\"The trampoline is awesome. The kids love it and it feels like it can withstand anything. \\nThe zipper on our safety net broke right around the time the warranty was expiring, but they replaced it quickly and for free. Can’t recommend them enough!\",\"Great product and great service\",{\"_137\":2584,\"_2563\":2585,\"_2565\":2566},\"2026-04-10T13:24:12\",186085030,\"Brandon\",831230094,\"We love our trampoline! Very sturdy and easy to put together, it can be done by one person (I did it by myself in less than 2 hrs). We noticed we were missing some parts and I reached out to customer service they were really helpful and we got the pieces we needed 2 days later. Very fast shipping for everything, great quality product, and amazing customer service. I would buy from this company over and over again.\",\"Hero 15 ft trampoline\",{\"_137\":2591,\"_2563\":2592,\"_2565\":2566},\"2026-04-18T15:40:17\",64410792,\"Kristin B.\",834155761,\"We've owned this trampoline for 2 years. Hero 15ft, it's left up all year and used rain or shine!\\n\\n2 rips, no tears, no broken pieces! (Zipper included)\\n\\nThis has been the best trampoline we've had, from sleep overs in the summer, sprinkler pads on the trampoline for a water feature, to playing in the snow, it has held up to it all!\\n\\nHighly recommend for anyone with kids!\",\"2 year check in.\",{\"_137\":2598,\"_2563\":2599,\"_2565\":2566},\"2026-04-26T19:30:03\",143917985,\"Ian p.\",836732114,\"I’ll lay it out clearly for you so you can grab it easily:\\n\\nWe’ve had our Jumpflex trampoline for about five years now on our large property with lots of kids, and it’s been wonderful and durable. We did have some holes in the mat (not sure how they happened), but the customer care was exceptional. Thanks to their lifetime warranty, they quickly addressed our concerns and shipped replacements. We’re super appreciative of how responsive and helpful they were. We’d definitely recommend their trampolines, and when we need a new one, we’ll buy from them again!\",\"Five Years of Durable Fun and Exceptional Service\",{\"_137\":2605,\"_2563\":2606,\"_2565\":2566},\"2026-05-06T15:38:06\",232903272,\"Brynn K.\",857834489,\"Install was super simple. It did take some time since I was solo. Quality is unmatched. Love the sunshade and basketball hoop. The kids have not wanted to come inside. It bounces super high, and with the weight limit, my whole family can be on it. High quality and a great price for what you get. The anchor kit was easy to use and the tramp is definetly secured so i have peace of mind. Would recommend this to anybody who is looking for an out of ground trampoline.\",\"Best decision we've made!\",{\"_137\":2612,\"_2563\":2613,\"_2565\":2566},\"2026-06-15T15:55:36\",149089229,\"Hayden C.\",861722840,\"Was looking for a quality trampoline, would definitely says it’s fair to above average quality. Kids love it, I love to see them love it. Customer support is amazing aswell. Thanks again Jumpflex\",\"A+\",{\"_137\":2619,\"_2563\":2620,\"_2565\":2566},\"2026-06-25T23:31:15\",278584035,\"Hunter\",868484612,\"We ordered the 10ft Flex Trampoline with the basketball net and what can I say. Incredible premium product. Went up with ease in about an hour which is a miracle compared to some trampolines and my boys haven’t got off it since. One of the pole connectors bent after a few days but no problem there, the team at jumpflex sent over a replacement straight away and it showed up the next day. They can’t seem to do enough for their customers. I would recommend them to anyone looking to purchase a trampoline for their kids. We are confident to leave the kids (4 and 2) on there and have no worries about their safety. Already looking at more accessories for it like the slide and jump shade. Would purchase again if we ever need a new one.\",\"Amazing product and customer service\",{\"_137\":2626,\"_2563\":2627,\"_2565\":2566},\"2026-07-12T09:09:46\",284153176,\"Rich\",871552641,\"Very responsive and helpful customer service. My kids love the trampoline. One of the best purchases we've ever made!\",\"Amazing customer service\",{\"_137\":2633,\"_2563\":2634,\"_2565\":2566},\"2026-07-18T21:43:25\",286831054,\"L. L.\",877991323,\"Firstly, five stars for customer service. They have odd USA hours since they’re in New Zealand I think so I left a message and the lady called back as soon as they opened.\\nShe was so helpful answering questions and making suggestions.\\nI made the order and paid over the phone with her. We ordered the Hero 15’ with the Smartshade and the Projam. It arrived two days later in six boxes.\\nIt was very easy to put together, around an hour. I recommend watching the video first but you don’t have to.\\nSo far it looks and functions great, we’ve only had it for a couple of days so I can’t say anything about it lasting. It does seem durable and high quality though.\\nDefinitely recommend!\",\"Customer service\",{\"_137\":2640,\"_2563\":2641,\"_2565\":2566},\"2026-08-06T17:31:37\",290742851,\"Brian G.\",{\"_137\":2551,\"_2644\":2651,\"_48\":2652,\"_2647\":2653,\"_2649\":-5},{\"_137\":2568,\"_2644\":2645,\"_48\":2646,\"_2647\":2648,\"_2649\":2650},\"domainKey\",\"825270239276\",\"PROJAM™\",\"productLink\",\"https://yotpo.com/go/tUzSEfyB\",\"imageUrl\",\"https://cdn-yotpo-images-production.yotpo.com/Product/48974725/40295504/square.jpg?1722912190\",\"yotpo_site_reviews\",\"Jumpflex US\",\"https://yotpo.com/go/tzckFc4l\",\"totalReview\",19020,\"averageScore\",4.817771]\n");</script>

    splitLines.forEach(function(line, idx) {
      line.style.transition = 'transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) ' + ((idx % 6) * 0.08) + 's, opacity 0.8s ease ' + ((idx % 6) * 0.08) + 's';

      line.style.opacity = '1';

      line.style.display = 'block';
    });

    // Restaura textos que possam estar em aria-label mas vazios nos spans internos
    document.querySelectorAll('[aria-label][data-v-30d30ebe]').forEach(function(container) {
      const label = container.getAttribute('aria-label');
      if (label && (!container.innerText || container.innerText.trim() === '')) {
        const line = container.querySelector('.appear-line');
        if (line) line.textContent = label;
      }
    });

    // --- 3. REVELAÇÃO CINEMATOGRÁFICA DE CORTINAS SOBRE IMAGENS (OVERLAY CURTAINS) ---
    // Procura divs com bg-secondary e z-10 cobrindo imagens de serviços e projetos
    const curtainOverlays = Array.from(document.querySelectorAll('div.bg-secondary.z-10, div[class*="bg-secondary"][class*="z-10"], div[class*="bg-black"][class*="z-10"]'));
    curtainOverlays.forEach(function(curtain) {
      // Verifica se é uma cortina sobreposta a uma imagem
      const parent = curtain.parentElement;
      if (parent && (parent.querySelector('img') || parent.classList.contains('overflow-hidden') || parent.classList.contains('aspect-[5/3]'))) {
        curtain.style.transition = 'transform 1.1s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease';
        curtain.style.transformOrigin = 'top';
        curtain.style.pointerEvents = 'none';

        const observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              curtain.style.transform = 'translateY(-101%)';
              curtain.style.opacity = '0';
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        observer.observe(parent);
      }
    });

    // --- 4. MOTOR 3D CILÍNDRICO PROCEDURAL (#intro-logo-spinner) ---
    const spinnerContainer = document.getElementById('intro-logo-spinner');
    if (spinnerContainer) {
      const squares = Array.from(spinnerContainer.querySelectorAll('[data-spinner-square]'));
      const count = squares.length || 8;
      const angleStep = 360 / count;
      const radius = window.innerWidth > 640 ? (window.innerWidth * 0.48) : (window.innerWidth * 0.7);

      spinnerContainer.style.transformStyle = 'preserve-3d';
      spinnerContainer.style.position = 'relative';

      squares.forEach(function(sq, i) {
        const angle = i * angleStep;
        sq.style.position = 'absolute';
        sq.style.left = '50%';
        sq.style.top = '50%';
        sq.style.margin = '-' + (sq.offsetHeight / 2) + 'px 0 0 -' + (sq.offsetWidth / 2) + 'px';

        sq.style.transition = 'opacity 0.5s ease, filter 0.5s ease, transform 0.3s ease-out';
        sq.style.pointerEvents = 'auto';

        // Revela imagem interna
        const innerImgWrapper = sq.firstElementChild;
        if (innerImgWrapper) {
          innerImgWrapper.style.opacity = '1';
          innerImgWrapper.style.visibility = 'visible';
        }
      });

      let currentRotation = 0;
      let targetRotation = 0;
      let isDragging = false;
      let startX = 0;
      let autoSpinSpeed = 0.15;

      function updateSpinnerTransform() {
        currentRotation += (targetRotation - currentRotation) * 0.08;
        spinnerContainer.style.transform = 'rotateX(-5deg) rotateY(' + currentRotation + 'deg)';

        // Aplica foco e iluminação dinâmica nos itens voltados para a frente
        squares.forEach(function(sq, i) {
          const itemAngle = (i * angleStep + currentRotation) % 360;
          const normalizedAngle = (itemAngle + 360) % 360;
          const distToFront = Math.min(normalizedAngle, 360 - normalizedAngle);
          const brightness = Math.max(0.35, 1 - (distToFront / 180) * 0.7);
          sq.style.filter = 'brightness(' + brightness + ')';
          sq.style.zIndex = Math.round(100 - distToFront);
        });
      }

      // Interação por Scroll
      window.addEventListener('scroll', function() {
        const scrollY = window.pageYOffset || window.scrollY || 0;
        targetRotation = scrollY * 0.22;
      }, { passive: true });

      // Interação por Mouse Drag
      const spinnerParent = spinnerContainer.parentElement || spinnerContainer;
      spinnerParent.addEventListener('mousedown', function(e) {
        isDragging = true;
        startX = e.clientX;
      });
      window.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        const delta = e.clientX - startX;
        targetRotation += delta * 0.35;
        startX = e.clientX;
      });
      window.addEventListener('mouseup', function() { isDragging = false; });

      // Touch para mobile
      spinnerParent.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches[0]) {
          isDragging = true;
          startX = e.touches[0].clientX;
        }

        if (!isDragging || !e.touches || !e.touches[0]) return;
        const delta = e.touches[0].clientX - startX;
        targetRotation += delta * 0.45;
        startX = e.touches[0].clientX;
      }, { passive: true });
      window.addEventListener('touchend', function() { isDragging = false; });

      function spinnerLoop() {
        if (!isDragging) {
          targetRotation += autoSpinSpeed;
        }
        updateSpinnerTransform();
        requestAnimationFrame(spinnerLoop);
      }
      requestAnimationFrame(spinnerLoop);
    }

    // A) Hero Slider (4 Imagens de Fundo)
    const heroImageContainers = Array.from(document.querySelectorAll('.w-full.h-full.relative > .w-full.h-full.absolute.top-0.left-0'));
    const heroProgressBars = Array.from(document.querySelectorAll('.project-slider-progress-line'));

      let heroTimer = null;
      const heroSlideDuration = 5500; // 5.5s

        activeHeroIndex = index % heroImageContainers.length;

        heroImageContainers.forEach(function(imgWrap, i) {
          imgWrap.style.transition = 'opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1)';

            imgWrap.style.opacity = '1';
            imgWrap.style.transform = 'scale(1.0)';
            imgWrap.classList.remove('opacity-0');
          } else {
            imgWrap.style.opacity = '0';
            imgWrap.style.transform = 'scale(1.05)';
          }
        });

        heroProgressBars.forEach(function(barWrap, i) {
          const fill = barWrap.querySelector('.bg-primary');
          if (!fill) return;
          fill.style.transition = 'none';
          if (i < activeHeroIndex) {
            fill.style.transform = 'scaleX(1)';
          } else if (i === activeHeroIndex) {
            fill.style.transform = 'scaleX(0)';
            setTimeout(function() {
              fill.style.transition = 'transform ' + (heroSlideDuration / 1000) + 's linear';
              fill.style.transform = 'scaleX(1)';

          } else {
            fill.style.transform = 'scaleX(0)';
          }
        });
      }

      heroProgressBars.forEach(function(barWrap, i) {
        const parentBtn = barWrap.closest('.cursor-pointer') || barWrap;
        parentBtn.addEventListener('click', function() {
          clearInterval(heroTimer);
          setHeroSlide(i);
          heroTimer = setInterval(function() {
            setHeroSlide((activeHeroIndex + 1) % heroImageContainers.length);

      heroTimer = setInterval(function() {
        setHeroSlide((activeHeroIndex + 1) % heroImageContainers.length);

    const testimonialSection = document.querySelector('[class*="aspect-[16/12]"]')?.closest('.layout-grid') || document.querySelector('[class*="-mt-[5vw]"]')?.parentElement;
    if (testimonialSection) {
      const testImages = Array.from(testimonialSection.querySelectorAll('[class*="aspect-[16/12]"] [class*="absolute"]'));
      const testAvatars = Array.from(testimonialSection.querySelectorAll('[class*="aspect-square"] [class*="absolute"]'));
      const testProgressBars = Array.from(testimonialSection.querySelectorAll('.cursor-pointer .bg-primary'));
      const testQuotes = Array.from(testimonialSection.querySelectorAll('.invisible.pointer-events-none > div'));
      const mainQuoteLine = testimonialSection.querySelector('[aria-label*="Storey brought"]')?.closest('.appear-line-mask')?.parentElement || testimonialSection.querySelector('.appear-line')?.parentElement;

      if (testImages.length >= 2) {
        let activeTestIndex = 0;
        let testTimer = null;
        const testDuration = 6000;

        function setTestimonial(idx) {
          activeTestIndex = idx % testImages.length;

          testImages.forEach(function(img, i) {
            img.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
            if (i === activeTestIndex) {
              img.style.opacity = '1';
              img.style.transform = 'scale(1)';
            } else {
              img.style.opacity = '0';
              img.style.transform = 'scale(1.05)';
            }
          });

          testAvatars.forEach(function(av, i) {
            av.style.transition = 'opacity 0.6s ease';
            av.style.opacity = i === activeTestIndex ? '1' : '0';
          });

          testProgressBars.forEach(function(bar, i) {
            bar.style.transition = 'none';
            if (i < activeTestIndex) {
              bar.style.transform = 'scaleX(1)';
            } else if (i === activeTestIndex) {
              bar.style.transform = 'scaleX(0)';
              setTimeout(function() {
                bar.style.transition = 'transform ' + (testDuration / 1000) + 's linear';
                bar.style.transform = 'scaleX(1)';
              }, 30);
            } else {
              bar.style.transform = 'scaleX(0)';
            }
          });

          // Atualiza texto do depoimento
          if (testQuotes[activeTestIndex] && mainQuoteLine) {
            const newText = testQuotes[activeTestIndex].innerText.trim();
            const targetLine = testimonialSection.querySelector('.appear-line');
            if (targetLine) {
              targetLine.style.opacity = '0';
              targetLine.style.transform = 'translateY(10px)';
              setTimeout(function() {
                targetLine.textContent = newText;
                targetLine.style.opacity = '1';
                targetLine.style.transform = 'translateY(0)';
              }, 250);
            }
          }
        }

        const barContainers = Array.from(testimonialSection.querySelectorAll('[class*="cursor-pointer"]')).filter(function(el) {
          return el.querySelector('.bg-primary') || el.querySelector('.bg-primary\/30');
        });
        barContainers.forEach(function(container, i) {
          container.addEventListener('click', function() {
            clearInterval(testTimer);
            setTestimonial(i);
            testTimer = setInterval(function() {
              setTestimonial((activeTestIndex + 1) % testImages.length);
            }, testDuration);
          });
        });

        setTestimonial(0);
        testTimer = setInterval(function() {
          setTestimonial((activeTestIndex + 1) % testImages.length);
        }, testDuration);
      }
    }

    // --- 7. HOVER BADGES INTERATIVOS & MICRO-INTERAÇÕES ---
    document.querySelectorAll('a[href*="/projects/"]').forEach(function(link) {
      const badge = link.querySelector('.bg-primary.w-fit.h-fit');
      if (badge) {
        badge.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        link.addEventListener('mouseenter', function() {
          badge.style.opacity = '1';
          badge.style.transform = 'scale(1.05)';
        });
        link.addEventListener('mouseleave', function() {
          badge.style.opacity = '0';
          badge.style.transform = 'scale(0.95)';
        });
      }
    });

    // --- 8. STACKING CARDS & METRIC STATS SLIDERS (15+ / 30+ SEM SOBREPOSIÇÃO) ---
    const stackingCards = Array.from(document.querySelectorAll('[data-stacking-cards-item]'));
    if (stackingCards.length > 1) {
      let activeCardIdx = 0;
      function renderStackingCard(idx) {
        activeCardIdx = (idx + stackingCards.length) % stackingCards.length;
        stackingCards.forEach(function(c, i) {
          c.style.transition = 'opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
          if (i === activeCardIdx) {
            c.style.opacity = '1';
            c.style.visibility = 'visible';
            c.style.transform = 'translateY(0px)';
            c.style.position = 'relative';
            c.style.pointerEvents = 'auto';
          } else {
            c.style.opacity = '0';
            c.style.visibility = 'hidden';
            c.style.transform = 'translateY(15px)';
            c.style.position = 'absolute';
            c.style.pointerEvents = 'none';
          }
        });

        // Atualiza indicadores numéricos como 01/02
        const navLines = document.querySelectorAll('.problem_stats_line, .problem_stats_navigation');
        navLines.forEach(function(nl) {
          const spans = nl.querySelectorAll('span, div');
          if (spans.length >= 2) {
            spans[0].textContent = String(activeCardIdx + 1).padStart(2, '0');
          }
        });
      }

      renderStackingCard(0);
      let cardTimer = setInterval(function() {
        renderStackingCard(activeCardIdx + 1);
      }, 4500);

      // Conecta botões/setas de navegação
      document.querySelectorAll('.problems_home_stats button, .problems_home_stats a, [class*="stats_nav"], .problems_stats_navigation').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          clearInterval(cardTimer);
          renderStackingCard(activeCardIdx + 1);
          cardTimer = setInterval(function() {
            renderStackingCard(activeCardIdx + 1);
          }, 4500);
        });
      });
    }

    // --- 9. SCROLL-LINKED TEXT HIGHLIGHT REVEAL ([data-highlight-text]) ---
    document.querySelectorAll('[data-highlight-text]').forEach(function(container) {
      if (container.dataset.highlightActivated) return;
      container.dataset.highlightActivated = 'true';
      const text = container.innerText.trim();
      const words = text.split(/\s+/);
      container.innerHTML = '';
      const wordSpans = words.map(function(w) {
        const span = document.createElement('span');
        span.textContent = w + ' ';
        span.style.display = 'inline';
        span.style.transition = 'color 0.35s ease, opacity 0.35s ease';
        span.style.color = '#71717a';
        span.style.opacity = '0.35';
        container.appendChild(span);
        return span;
      });

      function updateTextHighlight() {
        const rect = container.getBoundingClientRect();
        const winH = window.innerHeight;
        const progress = Math.min(Math.max((winH * 0.85 - rect.top) / (rect.height + winH * 0.35), 0), 1);
        const activeCount = Math.floor(progress * wordSpans.length);

        wordSpans.forEach(function(sp, i) {
          if (i <= activeCount) {
            sp.style.color = '#fafaf9';
            sp.style.opacity = '1';
          } else {
            sp.style.color = '#71717a';
            sp.style.opacity = '0.35';
          }
        });
      }

      window.addEventListener('scroll', updateTextHighlight, { passive: true });
      updateTextHighlight();
    });

    // --- 10. GAP SECTION / KINETIC IMAGE CAROUSEL & LETTER SCRUB ---
    const gapSection = document.querySelector('.gap_home_wrap, [class*="gap_wrap"]');
    if (gapSection) {
      const gapImages = Array.from(gapSection.querySelectorAll('.gap_home_image, [class*="gap_image"]'));
      if (gapImages.length > 1) {
        let gapIdx = 0;
        gapImages.forEach(function(img, i) {
          img.style.transition = 'opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1)';
          img.style.opacity = i === 0 ? '1' : '0';
        });
        setInterval(function() {
          gapImages.forEach(function(img) { img.style.opacity = '0'; });
          gapIdx = (gapIdx + 1) % gapImages.length;
          gapImages[gapIdx].style.opacity = '1';
        }, 900);
      }
    }

    // --- 12. MOTOR UNIVERSAL DE REVELAÇÃO WEBFLOW (data-anim="split", data-anim="element", data-anim="stagger", data-anim="slideUp-once") ---
    if (typeof gsap !== 'undefined') {
      // 12.1 Data-anim split
      document.querySelectorAll('[data-anim="split"]').forEach(function(el) {
        if (el.closest('.amenities-slide-box')) return;
        try {
          if (typeof SplitText !== 'undefined') {
            const cleanText = el.getAttribute('aria-label') || el.textContent.trim();
            el.innerHTML = cleanText;
            const st = new SplitText(el, { type: 'lines', linesClass: 'split-line', mask: 'lines' });
            if (st.lines && st.lines.length > 0) {
              const triggerEl = el.closest('section, .wrap') || el;
              gsap.from(st.lines, {
                y: '100%',
                opacity: 0,
                duration: 0.8,
                stagger: 0.08,
                ease: 'power3.out',
                scrollTrigger: {
                  trigger: triggerEl,
                  start: 'top 90%',
                  once: true
                }
              });
            }
          }
        } catch(e) {}
      });

      // 12.2 Data-anim element e slideUp-once
      document.querySelectorAll('[data-anim="element"], [data-anim="slideUp-once"]').forEach(function(el) {
        if (el.closest('.amenities-slide-box')) return;
        const triggerEl = el.closest('section, .wrap') || el;
        gsap.fromTo(el, 
          { y: 30, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.8,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: triggerEl,
              start: 'top 90%',
              once: true
            }
          }
        );
      });

      // 12.3 Data-anim stagger
      document.querySelectorAll('[data-anim="stagger"]').forEach(function(el) {
        const children = Array.from(el.children).filter(function(child) {
          return !child.hasAttribute('data-dropdown-list') && !child.classList.contains('faq-dropdown-list');
        });
        if (children.length > 0) {
          const triggerEl = el.closest('section, .wrap') || el;
          gsap.fromTo(children,
            { y: 40, opacity: 0 },
            {
              y: 0,
              opacity: 1,
              duration: 0.8,
              stagger: 0.1,
              ease: 'power3.out',
              scrollTrigger: {
                trigger: triggerEl,
                start: 'top 90%',
                once: true
              }
            }
          );
        }
      });
      // 12.4 Data-anim img-overlay
      document.querySelectorAll('[data-anim="img-overlay"]').forEach(function(el) {
        gsap.to(el, {
          yPercent: -100,
          duration: 1.1,
          ease: 'power3.inOut',
          scrollTrigger: {
            trigger: el.parentElement || el,
            start: 'top 80%',
            once: true
          }
        });
      });

      // 12.5 Data-anim img-paralax / img-parallax (Parallax de imagens Webflow)
      document.querySelectorAll('[data-anim="img-paralax"], [data-anim="img-parallax"]').forEach(function(el) {
        gsap.fromTo(el,
          { yPercent: -10, scale: 1.1 },
          {
            yPercent: 10,
            scale: 1,
            ease: 'none',
            scrollTrigger: {
              trigger: el.closest('section, .wrap') || el,
              start: 'top bottom',
              end: 'bottom top',
              scrub: true
            }
          }
        );
      });

      // 12.6 FAQ Dropdown Hover & Click Engine
      document.querySelectorAll('.faq [data-dropdown]').forEach(function(dropdown) {
        dropdown.addEventListener('mouseenter', function() {
          dropdown.classList.add('is-active');
        });
        dropdown.addEventListener('mouseleave', function() {
          dropdown.classList.remove('is-active');
        });
        dropdown.addEventListener('click', function() {
          dropdown.classList.toggle('is-active');
        });
      });
    }

    console.log('✅ [Universal Scroll Director] Todos os subsistemas (SplitText, 3D Spinner, Curtains, Sliders, Highlights, Stacking Cards, Accordions, Webflow Reveals) ativados com sucesso.');
  });
})();
</script>
</body></html>
